name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:run

  api-typecheck:
    name: API — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  orbital-test:
    name: Orbital — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orbital
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/orbital/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest

  # apps/orbital is no longer deployed anywhere. It is a library now: satellites.py is
  # imported by the scheduled refresh job, and passes.py is the parity source for the
  # Vercel pass-prediction function. The image build is kept as a cheap check that the
  # Python app still assembles; the ECR push and ECS redeploy that used to follow it were
  # removed when the AWS account was suspended and the service migrated to Vercel.
  orbital-docker:
    name: Orbital — Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build apps/orbital
