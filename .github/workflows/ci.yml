name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Web — lint, typecheck, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test:run

  api-typecheck:
    name: API — typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  orbital-test:
    name: Orbital — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/orbital
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: apps/orbital/requirements.txt
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m pytest

  orbital-docker:
    name: Orbital — Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Docker image
        run: docker build apps/orbital

  ecr-push:
    name: Orbital — ECR push
    needs: orbital-docker
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && vars.AWS_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/satlas-ci
          aws-region: ap-southeast-2
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        run: |
          IMAGE_URI=${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-2.amazonaws.com/satlas-orbital:latest
          docker build --platform linux/amd64 -t $IMAGE_URI apps/orbital/
          docker push $IMAGE_URI
      - name: Force ECS redeploy
        run: |
          aws ecs update-service \
            --cluster satlas \
            --service satlas-orbital \
            --force-new-deployment \
            --region ap-southeast-2 \
            > /dev/null
