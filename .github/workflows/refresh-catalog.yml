name: Refresh catalog

# The single Space-Track client, replacing the ECS worker after the AWS account was
# suspended. The schedule IS the rate limit: one invocation issues at most one gp query
# and then exits, so the crash-loop that caused the S44 suspension is not expressible here.
#
# :17 past the hour matches the off-peak minute Space-Track's guidance asks for and the
# GP_QUERY_MINUTE the worker used. SATCAT is not on its own schedule; refresh_job.py gates
# it internally to once per UTC day at/after 1700, so 23 of the 24 daily runs skip it.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# Never let two runs overlap. Without this a delayed run could still be fetching when the
# next hour fires, which would put two gp queries in flight inside one hour.
concurrency:
  group: refresh-catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Space-Track to Vercel Blob
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # httpx is all refresh_job.py needs. boto3 is deliberately absent: satellites.py
      # imports it lazily and the Blob path never touches AWS.
      - name: Install dependencies
        run: pip install --no-cache-dir httpx==0.27.0

      - name: Fetch from Space-Track
        id: refresh
        working-directory: apps/orbital
        env:
          SPACETRACK_USER: ${{ secrets.SPACETRACK_USER }}
          SPACETRACK_PASS: ${{ secrets.SPACETRACK_PASS }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          # CATALOG_BLOB_BASE is deliberately NOT set from `vars`. An undefined
          # `${{ vars.X }}` expands to an empty string rather than staying unset, which
          # silently blanked the base URL and made every run look like a cold start.
        run: python refresh_job.py

      # Keep the fetched data even if publishing fails. A gp query costs an hour of the
      # rate budget, so losing it to a storage error means waiting an hour to retry.
      - name: Preserve fetched data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-${{ github.run_id }}
          path: |
            apps/orbital/catalog.tle
            apps/orbital/satcat.json
          if-no-files-found: ignore
          retention-days: 7


